name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both halves: tsc for the types and the test output, esbuild for the two bundles the editor
      # loads. The tests need both -- `contributes.test.ts` checks that `main` points at something
      # that exists, and `serverProtocol.test.ts` spawns the built server and talks LSP to it.
      - name: Build
        run: npm run build

      - name: Test
        run: node --test out/test/
